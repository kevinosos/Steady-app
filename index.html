<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Steady — daily rituals</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/svg+xml" href="logo.svg">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="theme-color" content="#F8FAF5">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Newsreader:opsz,wght@6..72,400;6..72,500;6..72,600&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
  :root{
    --bg: #FAF7F2;
    --ink: #2B2A28;
    --ink-soft: #6b6a66;
    --sage: #4C6B52;
    --sage-soft: #DDE7DE;
    --clay: #C1683C;
    --clay-soft: #F3DFD2;
    --line: #DAD3C7;
    --card: #FFFFFF;
    --highlight: #EDE7DA;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    background:var(--bg);
    color:var(--ink);
    font-family:'Inter',sans-serif;
    padding:0;
  }
  .wrap{
    max-width:980px;
    margin:0 auto;
    padding:40px 24px 80px;
  }
  .wrap.wide{ max-width:1360px; }
  header{
    display:flex;
    justify-content:space-between;
    align-items:flex-end;
    margin-bottom:20px;
    border-bottom:1px solid var(--line);
    padding-bottom:24px;
    gap:16px;
    flex-wrap:wrap;
  }
  h1{
    font-family:'Source Serif 4', serif;
    font-weight:600;
    font-size:38px;
    margin:0 0 6px;
    letter-spacing:-0.01em;
  }
  .sub{
    color:var(--ink-soft);
    font-size:14.5px;
    max-width:38ch;
    line-height:1.5;
  }
  .week-nav{
    display:flex;
    align-items:center;
    gap:14px;
  }
  .week-nav button{
    background:none;
    border:1px solid var(--line);
    border-radius:100px;
    width:34px;
    height:34px;
    cursor:pointer;
    font-size:16px;
    color:var(--ink);
    transition:background .15s;
  }
  .week-nav button:hover{ background:var(--highlight); }
  .week-label{
    font-family:'Source Serif 4', serif;
    font-size:16px;
    min-width:150px;
    text-align:center;
  }

  .tabs{ display:flex; gap:6px; margin-bottom:24px; }
  .tab{
    border:1px solid var(--line);
    background:var(--card);
    padding:8px 16px;
    border-radius:100px;
    font-size:13px;
    font-family:'Inter',sans-serif;
    cursor:pointer;
    color:var(--ink-soft);
    transition:all .15s;
  }
  .tab.active{ background:var(--ink); border-color:var(--ink); color:var(--bg); }
  .tab:hover:not(.active){ background:var(--highlight); }

  .overview{
    display:flex;
    gap:28px;
    align-items:center;
    background:var(--card);
    border:1px solid var(--line);
    border-radius:14px;
    padding:22px 26px;
    margin-bottom:28px;
    flex-wrap:wrap;
  }
  .overview .big{ font-family:'Source Serif 4', serif; font-size:44px; line-height:1; color:var(--sage); }
  .overview .big-label{ font-size:13px; color:var(--ink-soft); margin-top:4px; }
  .overview .bar-track{ flex:1; min-width:180px; height:8px; background:var(--highlight); border-radius:100px; overflow:hidden; }
  .overview .bar-fill{ height:100%; background:var(--sage); border-radius:100px; transition:width .3s ease; }
  .overview .streak{ display:flex; align-items:center; gap:12px; min-width:190px; padding:10px 14px; border:1px solid var(--clay-soft); border-radius:12px; background:var(--bg); color:var(--ink-soft); }
  .clean-streak-number{ color:var(--clay); font-family:'Source Serif 4',serif; font-size:38px; line-height:1; font-weight:600; }
  .clean-streak-copy{ display:flex; flex-direction:column; gap:3px; font-size:11px; white-space:normal; }
  .clean-streak-copy b{ color:var(--ink); font-size:13px; font-weight:600; }
  .clean-streak-copy span{ color:var(--ink-soft); }

  .days{ display:grid; grid-template-columns:repeat(auto-fit, minmax(170px, 1fr)); gap:12px; }
  @media (max-width:820px){ .days{ grid-template-columns:repeat(auto-fit, minmax(150px,1fr)); } }
  .day{
    background:var(--card);
    border:1px solid var(--line);
    border-radius:14px;
    padding:14px;
    display:flex;
    flex-direction:column;
    min-height:280px;
    min-width:0;
  }
  .day.today{ border-color:var(--sage); box-shadow:0 0 0 1px var(--sage); }
  .day-head{ display:flex; justify-content:space-between; align-items:baseline; margin-bottom:10px; cursor:pointer; }
  .day-head:hover .day-name{ color:var(--clay); }
  .day-name{ font-family:'Source Serif 4', serif; font-size:15px; transition:color .15s; }
  .day-date{ font-size:11px; color:var(--ink-soft); }
  .day-progress{ font-size:11px; color:var(--sage); font-weight:600; margin-bottom:10px; }
  .mood-row{ display:flex; flex-wrap:wrap; gap:5px; margin-bottom:12px; }
  .mood-dot{
    width:20px; height:20px; border-radius:50%;
    border:1px solid var(--line); background:var(--bg);
    cursor:pointer; font-size:0; flex-shrink:0;
  }
  .mood-dot.active{ background:var(--clay); border-color:var(--clay); }
  .tasks{ flex:1; display:flex; flex-direction:column; gap:6px; margin-bottom:10px; }
  .task{ display:flex; align-items:flex-start; gap:7px; font-size:12.5px; line-height:1.35; }
  .task input[type=checkbox]{ margin-top:2px; accent-color:var(--sage); cursor:pointer; flex-shrink:0; }
  .task-text{ min-width:0; overflow-wrap:break-word; }
  .task > .task-text, .task > .task-main{ flex:1; min-width:0; }
  .task-main{ display:flex; flex-direction:column; gap:2px; }
  .task.done .task-text{ text-decoration:line-through; color:var(--ink-soft); }
  .task .habit-tag, .task .del{ flex:0 0 auto; }
  .task .del{
    cursor:pointer; color:var(--ink-soft); font-size:13px;
    opacity:0; transition:opacity .15s; flex-shrink:0;
  }
  .task:hover .del{ opacity:1; }
  .task.habit-task{ border-left:2px solid var(--sage); padding-left:6px; margin-left:-8px; }
  .task.habit-task.quit-type{ border-left-color:var(--clay); }
  .habit-tag{
    font-size:8.5px; letter-spacing:.02em; color:var(--ink-soft);
    background:var(--highlight); padding:2px 6px; border-radius:100px;
    flex-shrink:0; align-self:center;
  }
  .add-task{ display:flex; gap:4px; }
  .add-task input{
    flex:1; min-width:0; border:1px solid var(--line); border-radius:7px;
    padding:6px 8px; font-size:12px; font-family:'Inter',sans-serif;
    background:var(--bg); color:var(--ink);
  }
  .add-task input:focus{ outline:none; border-color:var(--sage); }
  .add-task button{
    border:none; background:var(--sage); color:white; border-radius:7px;
    width:26px; font-size:15px; cursor:pointer; flex-shrink:0;
  }
  /* manual reordering + task details */
  .time-badge{ font-size:10.5px; color:var(--ink-soft); }
  .task.detailed{ padding:10px 0; border-bottom:1px solid var(--highlight); }
  .task.detailed .del{ opacity:.55; }
  .task-controls{ display:flex; flex-wrap:wrap; gap:6px; align-items:center; margin-top:6px; }
  .task-controls input[type=time]{
    border:1px solid var(--line); border-radius:7px; padding:5px 7px; font-size:12px;
    font-family:'Inter',sans-serif; background:var(--bg); color:var(--ink);
  }
  .order-ctrl{ display:flex; flex-direction:column; gap:2px; flex:0 0 auto; }
  .mv{
    border:1px solid var(--line); background:var(--bg); color:var(--ink-soft);
    border-radius:5px; width:22px; height:18px; font-size:9px; line-height:1; cursor:pointer;
    display:flex; align-items:center; justify-content:center; padding:0;
  }
  .mv:hover:not(:disabled){ background:var(--highlight); }
  .mv:disabled{ opacity:.3; cursor:default; }
  .task.detailed .order-ctrl{ flex-direction:row; }
  .task.detailed .mv{ width:28px; height:26px; font-size:11px; }
  .drag-handle{
    flex:0 0 auto; width:18px; text-align:center; color:var(--ink-soft);
    cursor:grab; touch-action:none; font-size:13px; line-height:1; user-select:none;
    padding:4px 0;
  }
  .drag-handle:active{ cursor:grabbing; }
  .task.dragging{ opacity:.55; background:var(--highlight); border-radius:8px; }
  .add-task.day-add{ max-width:420px; margin-top:12px; flex-wrap:wrap; gap:6px; }
  .add-task.day-add input[type=text]{ flex:1 1 180px; padding:8px 10px; font-size:13px; }
  .add-task.day-add input[type=time]{ flex:0 0 auto; padding:7px 8px; }
  .add-task.day-add button{ width:34px; height:34px; }
  .remind-toggle{
    border:1px solid var(--line); background:var(--bg); color:var(--ink-soft);
    border-radius:7px; width:30px; height:30px; font-size:14px; cursor:pointer;
    display:flex; align-items:center; justify-content:center;
  }
  .remind-toggle.on{ background:var(--clay); border-color:var(--clay); color:#fff; }
  .remind-toggle:disabled{ opacity:.35; cursor:default; }
  .habit-remind{
    border:1px solid var(--line); border-radius:6px; padding:2px 4px; font-size:10.5px;
    font-family:'Inter',sans-serif; background:var(--bg); color:var(--ink-soft); margin-left:8px;
    vertical-align:middle;
  }
  .push-bar{
    display:flex; align-items:center; gap:8px; font-size:12px; color:var(--ink-soft);
    margin-bottom:16px; flex-wrap:wrap;
  }
  .push-bar button{
    border:1px solid var(--line); background:var(--card); color:var(--ink);
    border-radius:100px; padding:6px 14px; font-size:12px; cursor:pointer;
    font-family:'Inter',sans-serif;
  }
  .push-bar button:hover{ background:var(--highlight); }
  .push-bar button:disabled{ opacity:.5; cursor:default; }
  .push-dot{ width:7px; height:7px; border-radius:50%; background:var(--line); flex-shrink:0; }
  .push-dot.on{ background:var(--sage); }
  @media (hover:none){ .task .del{ opacity:.55; } }
  /* sticky note */
  .sticky-toggle{
    position:fixed; right:20px; bottom:20px; z-index:60;
    width:50px; height:50px; border-radius:50%; border:none;
    background:var(--clay); color:#fff; font-size:20px; cursor:pointer;
    box-shadow:0 4px 14px rgba(0,0,0,.2); display:flex; align-items:center; justify-content:center;
  }
  .sticky-toggle:hover{ filter:brightness(1.06); }
  .sticky-panel{
    position:fixed; right:20px; bottom:82px; z-index:60;
    width:260px; max-width:calc(100vw - 40px);
    background:#FCEFAE; border:1px solid #E5D27C; border-radius:4px;
    box-shadow:0 10px 26px rgba(0,0,0,.22);
    transform:rotate(-1deg);
    padding:14px 14px 10px;
    font-family:'Inter',sans-serif;
  }
  .sticky-panel-head{ display:flex; justify-content:space-between; align-items:center; margin-bottom:6px; }
  .sticky-panel-head span{ font-size:11.5px; color:#8a7a2e; letter-spacing:.02em; }
  .sticky-panel-head .sticky-close{ cursor:pointer; color:#8a7a2e; font-size:15px; line-height:1; }
  .sticky-panel textarea{
    width:100%; height:160px; resize:vertical; border:none; background:transparent;
    font-family:'Inter',sans-serif; font-size:13.5px; color:#4a3f10; line-height:1.5;
    outline:none; padding:0;
  }
  .sticky-panel textarea::placeholder{ color:#a3934a; }
  .sticky-saved{ font-size:10px; color:#8a7a2e; text-align:right; min-height:14px; }
  @media (max-width:480px){ .sticky-panel{ right:16px; left:16px; width:auto; } }
  .footer-note{ margin-top:30px; font-size:12.5px; color:var(--ink-soft); text-align:center; }
  .loading{ text-align:center; padding:80px 0; color:var(--ink-soft); font-size:14px; }

  /* Error banner */
  .error-banner{
    background:var(--clay-soft); color:#8a3f1a;
    border:1px solid var(--clay); border-radius:10px;
    padding:12px 14px; font-size:12.5px; line-height:1.5;
    margin-bottom:20px; word-break:break-word;
    display:flex; gap:12px; align-items:flex-start; justify-content:space-between;
  }
  .error-banner b{ font-weight:600; }
  .error-banner .dismiss{ cursor:pointer; text-decoration:underline; white-space:nowrap; flex-shrink:0; }

  /* Day view */
  .day-view-card{ background:var(--card); border:1px solid var(--line); border-radius:16px; padding:32px; }
  .day-view-head{ display:flex; justify-content:space-between; align-items:center; margin-bottom:24px; flex-wrap:wrap; gap:14px; }
  .day-view-title{ font-family:'Source Serif 4', serif; font-size:26px; }
  .day-picker{ display:flex; align-items:center; gap:10px; }
  .day-picker input[type=date]{
    border:1px solid var(--line); border-radius:8px; padding:6px 10px;
    font-family:'Inter',sans-serif; font-size:13px; background:var(--bg); color:var(--ink);
  }
  .ring-row{ display:flex; align-items:center; gap:24px; margin-bottom:26px; flex-wrap:wrap; }
  .ring{
    width:96px; height:96px; border-radius:50%;
    display:flex; align-items:center; justify-content:center;
    font-family:'Source Serif 4', serif; font-size:22px; flex-shrink:0;
  }
  .ring-meta{ font-size:13px; color:var(--ink-soft); line-height:1.6; }
  .ring-meta b{ color:var(--ink); font-weight:600; }
  .day-view-tasks{ display:flex; flex-direction:column; gap:9px; max-width:560px; }
  .day-view-tasks .task{ font-size:14px; }
  .day-view-mood{ margin-top:22px; }
  .day-view-mood .mood-row .mood-dot{ width:26px; height:26px; }
  .section-label{ font-size:12px; color:var(--ink-soft); margin-bottom:10px; }

  /* Habits view */
  .habits-card{ background:var(--card); border:1px solid var(--line); border-radius:16px; padding:26px; overflow-x:auto; }
  .habits-add{ display:flex; gap:8px; margin-bottom:22px; max-width:460px; flex-wrap:wrap; }
  .habits-add input[type=text]{
    flex:1; min-width:160px; border:1px solid var(--line); border-radius:8px; padding:8px 10px;
    font-family:'Inter',sans-serif; font-size:13px; background:var(--bg); color:var(--ink);
  }
  .habits-add select{
    border:1px solid var(--line); border-radius:8px; padding:8px 10px;
    font-family:'Inter',sans-serif; font-size:13px; background:var(--bg); color:var(--ink);
  }
  .habits-add input:focus, .habits-add select:focus{ outline:none; border-color:var(--sage); }
  .habits-add button{
    border:none; background:var(--sage); color:white; border-radius:8px;
    padding:0 16px; font-size:13px; cursor:pointer;
  }
  table.habit-grid{ border-collapse:collapse; width:100%; min-width:640px; }
  table.habit-grid th, table.habit-grid td{ padding:6px 4px; text-align:center; font-size:11px; color:var(--ink-soft); }
  table.habit-grid th.name-col, table.habit-grid td.name-col{
    text-align:left; font-size:13px; color:var(--ink); padding-right:14px;
    white-space:nowrap; font-family:'Source Serif 4', serif;
  }
  .habit-type-tag{ font-size:9.5px; color:var(--ink-soft); font-family:'Inter',sans-serif; margin-left:6px; }
  table.habit-grid td.name-col .del-habit{
    color:var(--ink-soft); cursor:pointer; font-size:11px; margin-left:8px;
    opacity:0; transition:opacity .15s; font-family:'Inter',sans-serif;
  }
  table.habit-grid tr:hover td.name-col .del-habit{ opacity:1; }
  .habit-dot{ width:20px; height:20px; border-radius:6px; border:1px solid var(--line); background:var(--bg); cursor:pointer; margin:0 auto; }
  .habit-dot.done{ background:var(--sage); border-color:var(--sage); }
  .habit-dot.done.quit{ background:var(--clay); border-color:var(--clay); }
  .habit-dot.today-col{ box-shadow:0 0 0 1px var(--clay); }
  .habit-streak{ font-size:11px; color:var(--clay); font-weight:600; }
  th.today-col-head{ color:var(--clay); }
  .habits-empty{ color:var(--ink-soft); font-size:13px; padding:20px 0; }

  /* Celebration */
  .toast{
    position:fixed; top:20px; right:20px; background:var(--ink); color:var(--bg);
    padding:14px 18px; border-radius:10px; font-size:13px;
    box-shadow:0 6px 20px rgba(0,0,0,.18); z-index:9999; max-width:280px;
    animation: toastIn .25s ease, toastOut .25s ease 2.55s forwards;
  }
  @keyframes toastIn{ from{opacity:0; transform:translateY(-8px);} to{opacity:1; transform:translateY(0);} }
  @keyframes toastOut{ to{opacity:0; transform:translateY(-8px);} }
  .confetti-piece{ position:fixed; top:-10px; width:7px; height:7px; z-index:9998; pointer-events:none; animation: confettiFall 1.15s ease-in forwards; }
  @keyframes confettiFall{ to{ transform: translateY(105vh) rotate(var(--rot)); opacity:0; } }

  /* Auth */
  .auth-wrap{
    max-width:380px;
    margin:80px auto;
    background:var(--card);
    border:1px solid var(--line);
    border-radius:16px;
    padding:36px;
  }
  .auth-wrap h1{ font-size:30px; margin-bottom:6px; }
  .auth-sub{ color:var(--ink-soft); font-size:13.5px; margin-bottom:26px; line-height:1.5; }
  .auth-field{ margin-bottom:14px; }
  .auth-field label{ display:block; font-size:12px; color:var(--ink-soft); margin-bottom:5px; }
  .auth-field input{
    width:100%; border:1px solid var(--line); border-radius:8px;
    padding:10px 12px; font-family:'Inter',sans-serif; font-size:14px;
    background:var(--bg); color:var(--ink);
  }
  .auth-field input:focus{ outline:none; border-color:var(--sage); }
  .auth-submit{
    width:100%; border:none; background:var(--sage); color:white;
    border-radius:8px; padding:11px; font-size:14px; cursor:pointer;
    font-family:'Inter',sans-serif; font-weight:500; margin-top:6px;
  }
  .auth-submit:disabled{ opacity:.6; cursor:default; }
  .auth-forgot{ text-align:right; margin:-4px 0 4px; font-size:12.5px; }
  .auth-forgot a{ color:var(--ink-soft); cursor:pointer; text-decoration:underline; }
  .auth-toggle{
    text-align:center; margin-top:16px; font-size:12.5px; color:var(--ink-soft);
  }
  .auth-toggle a{ color:var(--sage); cursor:pointer; text-decoration:underline; }
  .auth-msg{
    font-size:12.5px; padding:10px 12px; border-radius:8px; margin-bottom:16px;
    line-height:1.5; word-break:break-word;
  }
  .auth-msg.error{ background:var(--clay-soft); color:#8a3f1a; }
  .auth-msg.success{ background:var(--sage-soft); color:#2f4633; }
  .user-bar{
    display:flex; align-items:center; gap:10px; font-size:12.5px; color:var(--ink-soft);
  }
  .user-bar .logout{
    cursor:pointer; color:var(--ink-soft); text-decoration:underline;
  }

/* Stitch redesign: Steady Ritual design system */
:root{
  --bg:#F8FAF5;
  --ink:#232623;
  --ink-soft:#687068;
  --sage:#233126;
  --sage-soft:#E3EAE2;
  --clay:#4A1A23;
  --clay-soft:#F0E7E8;
  --line:#E3E6DF;
  --card:#FFFFFF;
  --highlight:#EEF1EA;
  --olive:#6A7657;
}
body{font-family:'Plus Jakarta Sans',sans-serif;background:var(--bg);color:var(--ink);}
.wrap{max-width:1120px;padding:28px 28px 88px;}
.wrap.wide{max-width:1480px;}
header{align-items:center;border-bottom:0;padding:0 0 18px;margin-bottom:12px;}
.brand-lockup{display:flex;align-items:center;gap:12px;}
.brand-mark{width:48px;height:48px;object-fit:contain;flex:0 0 auto;}
h1{font-family:'Newsreader',serif;color:var(--clay);font-size:34px;font-weight:500;letter-spacing:-.03em;margin:0;}
.sub{font-size:12px;letter-spacing:.01em;max-width:none;margin-top:1px;}
.user-bar{background:#fff;border:1px solid var(--line);padding:10px 14px;border-radius:999px;}
.week-nav button,.day-picker input,.habits-add input,.habits-add select,.add-task input,.task-controls input{font-family:'Plus Jakarta Sans',sans-serif;}
.tabs{gap:6px;padding:5px;border-radius:999px;background:#ECEFE9;width:max-content;margin-bottom:26px;}
.tab{background:transparent;border:0;border-radius:999px;padding:10px 20px;color:#69716A;font-size:12px;font-weight:600;letter-spacing:.02em;}
.tab.active{background:var(--clay);border-color:var(--clay);color:#fff;box-shadow:0 3px 10px rgba(74,26,35,.16);}
.overview{border:0;background:#fff;border-radius:20px;padding:22px 26px;gap:22px;box-shadow:0 6px 24px rgba(35,49,38,.045);margin-bottom:30px;}
.overview .big{font-family:'Newsreader',serif;color:var(--clay);font-size:46px;}
.overview .bar-track{background:#ECEFE9;height:9px;}
.overview .bar-fill{background:linear-gradient(90deg,var(--clay),#8E5058);}
.overview .streak{background:#FBF7F5;border-color:#E9DCDD;border-radius:15px;}
.clean-streak-number{font-family:'Newsreader',serif;color:var(--clay);font-size:38px;}
.clean-streak-copy b{font-family:'Newsreader',serif;font-size:16px;}
.days{gap:14px;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));}

<script>
const DAY_NAMES = ['Sunday','Monday','Tuesday','Wednesday','Thursday','Friday','Saturday'];

function getMonday(d){

}
function fmt(date){
  const y = date.getFullYear();
  const m = String(date.getMonth()+1).padStart(2,'0');

  return `${y}-${m}-${d}`;

function parseDateKey(k){

}

}
function daysInMonth(year, monthIdx){ return new Date(year, monthIdx+1, 0).getDate(); }
function escapeHtml(str){
  const div = document.createElement('div');
  div.textContent = str;
  return div.innerHTML;
}

// ---- error reporting: nothing fails silently any more ----
function describeErr(e){
  if(!e) return 'Unknown error';
  const parts = [];
  if(e.code) parts.push(`[${e.code}]`);
  if(e.status) parts.push(`(HTTP ${e.status})`);
  parts.push(e.message || String(e));
  if(e.details) parts.push(e.details);
  if(e.hint) parts.push('Hint: ' + e.hint);
  return parts.join(' ');
}
function reportError(where, e){
  console.error('[Steady] ' + where + ' failed:', e);
  lastError = where + ' failed: ' + describeErr(e);
}
function dismissError(){
  lastError = null;
  render();
}
function localStorageWorks(){
  try{
    localStorage.setItem('__steady_test', '1');
    localStorage.removeItem('__steady_test');
    return true;
  }catch(e){ return false; }
}
const STORAGE_OK = localStorageWorks();
if(!STORAGE_OK){
  console.warn('[Steady] localStorage is blocked in this context, so your sign-in cannot survive a page refresh.');
}

async function storageGet(key){
  if(!sb || !currentUser){ return memoryCache[key] || null; }
  try{
    const { data, error } = await sb
      .from('user_data')
      .select('value')
      .eq('user_id', currentUser.id)
      .eq('key', key)
      .maybeSingle();
    if(error) throw error;
    persistOk = true;
    return data ? data.value : null;
  }catch(e){
    persistOk = false;
    reportError('Loading "' + key + '"', e);
    return memoryCache[key] || null;
  }
}
async function storageSet(key, obj){
  memoryCache[key] = obj;
  if(!sb || !currentUser){
    persistOk = false;
    reportError('Saving "' + key + '"', { message: 'You are not signed in, so nothing can be written to the database.' });
    return;
  }
  try{
    const { error } = await sb
      .from('user_data')
      .upsert(
        { user_id: currentUser.id, key, value: obj, updated_at: new Date().toISOString() },
        { onConflict: 'user_id,key' }
      );
    if(error) throw error;
    persistOk = true;
    lastError = null;
  }catch(e){
    persistOk = false;
    reportError('Saving "' + key + '"', e);
  }
}

// Render immediately so the UI never waits on the network, then persist,
// then re-render only if the save status changed.
async function persist(key, obj){
  render();
  const before = persistOk + '|' + lastError;
  await storageSet(key, obj);
  if(before !== persistOk + '|' + lastError) render();
}

async function loadWeek(){
  const key = 'week:' + fmt(currentMonday);
  const loaded = await storageGet(key);
  weekData = loaded || {};
  for(let i=0;i<7;i++){
    const d = new Date(currentMonday);
    d.setDate(d.getDate()+i);
    const k = fmt(d);
    if(!weekData[k]) weekData[k] = {tasks:[], mood:0};
  }
  render();
}
async function saveWeek(){
  await persist('week:' + fmt(currentMonday), weekData);
}
async function ensureDayLoaded(dateKey){
  const d = parseDateKey(dateKey);
  const mon = getMonday(d);
  if(fmt(mon) === fmt(currentMonday)) return;
  const key = 'week:' + fmt(mon);
  const loaded = await storageGet(key);
  currentMonday = mon;
  weekData = loaded || {};
  for(let i=0;i<7;i++){
    const dd = new Date(mon);
    dd.setDate(dd.getDate()+i);
    const k = fmt(dd);
    if(!weekData[k]) weekData[k] = {tasks:[], mood:0};
  }
}

async function loadHabitsGlobal(){
  const loaded = await storageGet('habits-global');
  habitsData = loaded || { habits: [], checks: {} };
}
async function saveHabits(){
  await persist('habits-global', habitsData);
}

function addTask(dateKey, text, opts){
  if(!text.trim()) return;
  if(!weekData[dateKey]) weekData[dateKey] = {tasks:[], mood:0};
  const task = {id: 't' + Date.now() + Math.random().toString(36).slice(2,7), text: text.trim(), done:false};
  if(opts && opts.time) task.time = opts.time;
  weekData[dateKey].tasks.push(task);
  saveWeek();
}
function addFromDayView(dateKey){
  const text = document.getElementById('dayinput-' + dateKey).value;
  const time = document.getElementById('daytime-' + dateKey).value;
  addTask(dateKey, text, { time });
}
// A task needs a time before it can have a reminder — a push with no "when" makes no sense.
function toggleTaskRemind(dateKey, idx){
  const t = weekData[dateKey] && weekData[dateKey].tasks[idx];
  if(!t) return;
  if(!t.time){
    lastError = 'Set a time on this task first — reminders need a time to fire at.';
    render();
    return;
  }
  t.remind = !t.remind;
  saveWeek();
}
function setHabitReminder(habitId, value){
  const h = habitsData.habits.find(x => x.id === habitId);
  if(!h) return;
  if(value) h.reminderTime = value; else delete h.reminderTime;
  saveHabits();
}

// ---- manual ordering: you set the order yourself with the ▲▼ arrows ----
function setTaskField(dateKey, idx, field, value){
  const t = weekData[dateKey] && weekData[dateKey].tasks[idx];
  if(!t) return;
  if(field === 'time'){
    if(value) t.time = value; else { delete t.time; delete t.remind; }
  }
  saveWeek();
}
function moveTask(dateKey, idx, delta){
  const arr = weekData[dateKey] && weekData[dateKey].tasks;
  if(!arr) return;
  const j = idx + delta;
  if(j < 0 || j >= arr.length) return;
  [arr[idx], arr[j]] = [arr[j], arr[idx]];
  saveWeek();
}
// Habits live in one shared list (habitsData.habits), so moving one here
// reorders it everywhere — every day shows habits in the same order.
function moveHabit(dateKey, habitId, delta){
  const visible = habitsForDate(dateKey);
  const pos = visible.findIndex(h => h.id === habitId);
  if(pos === -1) return;
  const targetPos = pos + delta;
  if(targetPos < 0 || targetPos >= visible.length) return;
  const aId = visible[pos].id, bId = visible[targetPos].id;
  const ai = habitsData.habits.findIndex(h => h.id === aId);
  const bi = habitsData.habits.findIndex(h => h.id === bId);
  if(ai === -1 || bi === -1) return;
  [habitsData.habits[ai], habitsData.habits[bi]] = [habitsData.habits[bi], habitsData.habits[ai]];
  saveHabits();
}
// Apply a full new order at once (from a finished drag), rather than one swap at a time.
// Both bail out and change nothing if the id set doesn't match exactly — better to no-op
// than to silently drop or duplicate a task.
function reorderTasks(dateKey, orderedIds){
  const arr = weekData[dateKey] && weekData[dateKey].tasks;
  if(!arr) return;
  const byId = new Map(arr.map(t => [t.id, t]));
  const newArr = orderedIds.map(id => byId.get(id)).filter(Boolean);
  if(newArr.length !== arr.length) return;
  weekData[dateKey].tasks = newArr;
  saveWeek();
}
// Habits are one shared list; this rewrites just the visible-on-this-date slice's order
// while leaving any not-yet-started habit's position untouched.
function reorderHabits(dateKey, orderedVisibleIds){
  const visible = habitsForDate(dateKey);
  if(orderedVisibleIds.length !== visible.length) return;
  const visibleIdSet = new Set(visible.map(h => h.id));
  const byId = new Map(habitsData.habits.map(h => [h.id, h]));
  let vi = 0;
  const newFull = habitsData.habits.map(h => {
    if(!visibleIdSet.has(h.id)) return h;
    return byId.get(orderedVisibleIds[vi++]);
  });
  if(vi !== orderedVisibleIds.length || newFull.some(x => !x)) return;
  habitsData.habits = newFull;
  saveHabits();
}

// ---- drag to reorder (mouse + touch, via Pointer Events) ----
// Moves the row in the DOM directly while dragging, and only writes to the
// data model once on drop — re-rendering mid-drag would destroy the element
// that has the pointer capture and silently kill the gesture.
let dragInfo = null;
function dragHandlePointerDown(e, type, dateKey){
  if(e.pointerType === 'mouse' && e.button !== 0) return;
  const row = e.currentTarget.closest('.task');
  if(!row) return;
  const container = row.parentElement;
  const selector = `.task[data-row-type="${type}"][data-row-date="${dateKey}"]`;
  if(container.querySelectorAll(selector).length < 2) return; // nothing to reorder against
  e.preventDefault();
  dragInfo = { type, dateKey, container, selector, row, pointerId: e.pointerId };
  try{ row.setPointerCapture(e.pointerId); }catch(err){}
  row.classList.add('dragging');
  document.addEventListener('pointermove', onDragPointerMove);
  document.addEventListener('pointerup', onDragPointerEnd);
  document.addEventListener('pointercancel', onDragPointerEnd);
}
function onDragPointerMove(e){
  if(!dragInfo) return;
  const { container, selector, row } = dragInfo;
  const y = e.clientY;
  const siblings = Array.from(container.querySelectorAll(selector)).filter(el => el !== row);
  for(const sib of siblings){
    const r = sib.getBoundingClientRect();
    if(y < r.top + r.height / 2){
      container.insertBefore(row, sib);
      return;
    }
  }
  container.appendChild(row);
}
function onDragPointerEnd(e){
  if(!dragInfo) return;
  const { type, dateKey, container, selector, row, pointerId } = dragInfo;
  try{ row.releasePointerCapture(pointerId); }catch(err){}
  row.classList.remove('dragging');
  document.removeEventListener('pointermove', onDragPointerMove);
  document.removeEventListener('pointerup', onDragPointerEnd);
  document.removeEventListener('pointercancel', onDragPointerEnd);
  const orderedIds = Array.from(container.querySelectorAll(selector)).map(el => el.getAttribute('data-row-id'));
  dragInfo = null;
  if(type === 'task') reorderTasks(dateKey, orderedIds);
  else reorderHabits(dateKey, orderedIds);
}

function fmtTime(hhmm){
  const [h, m] = hhmm.split(':').map(Number);
  return new Date(2000, 0, 1, h, m).toLocaleTimeString('en-US', { hour:'numeric', minute:'2-digit' });
}
function toggleTask(dateKey, idx){
  if(!weekData[dateKey] || !weekData[dateKey].tasks[idx]) return;
  weekData[dateKey].tasks[idx].done = !weekData[dateKey].tasks[idx].done;
  saveWeek();
}
function deleteTask(dateKey, idx){
  if(!weekData[dateKey]) return;
  weekData[dateKey].tasks.splice(idx,1);
  saveWeek();
}
function setMood(dateKey, level){
  if(!weekData[dateKey]) weekData[dateKey] = {tasks:[], mood:0};
  weekData[dateKey].mood = (weekData[dateKey].mood === level) ? 0 : level;
  saveWeek();
}
function shiftWeek(delta){
  const d = new Date(currentMonday);
  d.setDate(d.getDate() + delta*7);
  currentMonday = d;
  loadWeek();
}

function habitsForDate(dateKey){
  return habitsData.habits.filter(h => !h.createdAt || dateKey >= h.createdAt);
}
function dayTaskCounts(dateKey){
  const day = weekData[dateKey] || {tasks:[]};
  const manualTotal = day.tasks.length;
  const manualDone = day.tasks.filter(t=>t.done).length;
  const habits = habitsForDate(dateKey);
  const habitTotal = habits.length;
  const habitDone = habits.filter(h => habitsData.checks[dateKey] && habitsData.checks[dateKey][h.id]).length;
  return { total: manualTotal+habitTotal, done: manualDone+habitDone };
}
function weekStats(){
  let total=0, done=0;
  for(let i=0;i<7;i++){
    const d = new Date(currentMonday); d.setDate(d.getDate()+i);
    const c = dayTaskCounts(fmt(d));
    total+=c.total; done+=c.done;
  }
  return {total, done, pct: total ? Math.round((done/total)*100) : 0};
}
function cleanStreak(){
  const d = new Date();
  const todayKey = fmt(d);
  const todayQuitHabits = habitsForDate(todayKey).filter(h=>h.type==='quit');
  const todayIsClean = todayQuitHabits.length > 0 &&
    todayQuitHabits.every(h=>habitsData.checks[todayKey] && habitsData.checks[todayKey][h.id]);
  // Keep the current run alive until today's clean check-in is due.
  if(!todayIsClean) d.setDate(d.getDate()-1);

  let streak = 0;
  while(true){
    const key = fmt(d);
    const quitHabits = habitsForDate(key).filter(h=>h.type==='quit');
    if(quitHabits.length===0 || !quitHabits.every(h=>habitsData.checks[key] && habitsData.checks[key][h.id])) break;
    streak++;
    d.setDate(d.getDate()-1);
  }
  return streak;
}

async function openDay(dateKey){
  await ensureDayLoaded(dateKey);
  selectedDayKey = dateKey;
  currentView = 'day';
  render();
}
async function changeSelectedDay(dateKey){
  if(!dateKey) return;
  await ensureDayLoaded(dateKey);
  selectedDayKey = dateKey;
  render();
}

function addHabit(name, type){
  if(!name.trim()) return;
  const id = 'h' + Date.now();
  habitsData.habits.push({id, name: name.trim(), type: type || 'build', createdAt: fmt(new Date())});
  saveHabits();
}
function deleteHabit(id){
  habitsData.habits = habitsData.habits.filter(h=>h.id!==id);
  Object.values(habitsData.checks).forEach(dayChecks=>{ delete dayChecks[id]; });
  saveHabits();
}
async function toggleHabit(dateKey, habitId){
  if(!habitsData.checks[dateKey]) habitsData.checks[dateKey] = {};
  const wasChecked = !!habitsData.checks[dateKey][habitId];
  habitsData.checks[dateKey][habitId] = !wasChecked;
  const nowChecked = habitsData.checks[dateKey][habitId];
  const saving = saveHabits(); // renders right away, saves in the background
  if(nowChecked && !wasChecked){
    const habit = habitsData.habits.find(h=>h.id===habitId);
    if(habit) celebrate(habit, habitStreak(habitId));
  }
  await saving;
}
function shiftMonth(delta){
  const d = new Date(currentMonthDate);
  d.setMonth(d.getMonth()+delta);
  currentMonthDate = d;
  render();
}
function habitStreak(habitId){
  const habit = habitsData.habits.find(h=>h.id===habitId);
  const d = new Date();
  const todayKey = fmt(d);
  // An unchecked current day is still in progress, so keep yesterday's streak alive.
  if(!(habitsData.checks[todayKey] && habitsData.checks[todayKey][habitId])){
    d.setDate(d.getDate()-1);
  }
  let streak = 0;
  while(true){
    const key = fmt(d);
    if(habit && habit.createdAt && key < habit.createdAt) break;
    if(habitsData.checks[key] && habitsData.checks[key][habitId]){
      streak++;
      d.setDate(d.getDate()-1);
    } else break;
  }
  return streak;
}

function celebrationMessage(habit, streak){
  const isMilestone = MILESTONES.includes(streak);
  if(isMilestone){
    return `🏆 ${streak} days ${habit.type==='quit' ? 'clean' : 'strong'} on “${habit.name}”`;
  }
  if(streak<=1){
    return habit.type==='quit'
      ? `Good — stayed clean on “${habit.name}” today.`
      : `Nice — “${habit.name}” done for today.`;
  }
  return `🔥 ${streak}-day streak on “${habit.name}”`;
}
function spawnConfetti(){
  const colors = ['#4C6B52','#C1683C','#DDE7DE','#F3DFD2','#2B2A28'];
  for(let i=0;i<18;i++){
    const el = document.createElement('div');
    el.className = 'confetti-piece';
    const leftBase = Math.max(window.innerWidth - 160, 20);
    el.style.left = (leftBase + Math.random()*140) + 'px';
    el.style.background = colors[Math.floor(Math.random()*colors.length)];
    el.style.setProperty('--rot', (Math.random()*360)+'deg');
    el.style.animationDelay = (Math.random()*0.15)+'s';
    el.style.borderRadius = Math.random()>0.5 ? '50%' : '2px';
    document.body.appendChild(el);
    setTimeout(()=>el.remove(), 1500);
  }
}
function celebrate(habit, streak){
  const toast = document.createElement('div');
  toast.className = 'toast';
  toast.textContent = celebrationMessage(habit, streak);
  document.body.appendChild(toast);
  setTimeout(()=>toast.remove(), 2900);
  spawnConfetti();
}

function switchView(v){
  currentView = v;
  render();
}

function renderTabs(){
  return `
    <div class="tabs">
      <div class="tab ${currentView==='week'?'active':''}" onclick="switchView('week')">Week</div>
      <div class="tab ${currentView==='day'?'active':''}" onclick="switchView('day')">Day</div>
      <div class="tab ${currentView==='habits'?'active':''}" onclick="switchView('habits')">Habits</div>
    </div>

}

function orderArrowsHtml(onUp, onDown, isFirst, isLast){
  return `
    <span class="order-ctrl">
      <button class="mv" ${isFirst?'disabled':''} onclick="${onUp}" title="Move up">▲</button>
      <button class="mv" ${isLast?'disabled':''} onclick="${onDown}" title="Move down">▼</button>
    </span>
  `;
}

function habitTaskRowHtml(dateKey, habit, compact, isFirst, isLast){
  const checked = !!(habitsData.checks[dateKey] && habitsData.checks[dateKey][habit.id]);
  const label = habit.type==='quit' ? `Stay clean: ${escapeHtml(habit.name)}` : escapeHtml(habit.name);
  // Arrows stay in the roomier Day tab; the drag handle alone covers the narrow Week cards.
  const arrows = compact ? '' : orderArrowsHtml(
    `moveHabit('${dateKey}', '${habit.id}', -1)`,
    `moveHabit('${dateKey}', '${habit.id}', 1)`,
    isFirst, isLast
  );
  return `
    <div class="task habit-task ${habit.type==='quit'?'quit-type':''} ${checked?'done':''}" data-row-type="habit" data-row-date="${dateKey}" data-row-id="${habit.id}">
      <span class="drag-handle" onpointerdown="dragHandlePointerDown(event, 'habit', '${dateKey}')" title="Drag to reorder">⠿</span>
      <input type="checkbox" ${checked?'checked':''} onchange="toggleHabit('${dateKey}', '${habit.id}')">
      <span class="task-text">${label}</span>
      ${compact ? '' : '<span class="habit-tag">habit</span>'}
      ${arrows}
    </div>
  `;
}

function renderAdherenceMatrix(){
  const todayKey = fmt(new Date());
  const dates = Array.from({length:7}, (_,i)=>{
    const d = new Date(currentMonday);
    d.setDate(d.getDate()+i);
    return {date:d, key:fmt(d)};
  });
  const habits = habitsData.habits.filter(h=>!h.createdAt || h.createdAt<=dates[6].key);
  const header = dates.map(({date,key})=>`<th class="${key===todayKey?'today-col-head':''}">${DAY_NAMES[date.getDay()].slice(0,1)}</th>`).join('');
  const rows = habits.map(h=>{
    const cells = dates.map(({date,key})=>{
      const active = !h.createdAt || key>=h.createdAt;
      const done = !!(habitsData.checks[key] && habitsData.checks[key][h.id]);
      return `<td><button class="ledger-check ${done?'done':''} ${h.type==='quit'?'quit':''}" ${active?'':'disabled'} aria-label="${escapeHtml(h.name)} — ${DAY_NAMES[date.getDay()]} ${date.getDate()}: ${done?'done':'not done'}" onclick="toggleHabit('${key}','${h.id}')">${done?'✓':''}</button></td>`;
    }).join('');
    return `<tr><th class="ledger-habit">${escapeHtml(h.name)}<span>${h.type==='quit'?'Avoid':'Core'}</span></th>${cells}</tr>`;
  }).join('');
  return `
    <section class="ledger-card">
      <div class="section-heading">
        <div><span class="eyebrow">CONSISTENCY</span><h2>Habit adherence</h2></div>
        <span class="section-caption">Your seven-day rhythm</span>
      </div>
      ${habits.length ? `<div class="ledger-scroll"><table class="adherence-grid"><thead><tr><th>Ritual</th>${header}</tr></thead><tbody>${rows}</tbody></table></div>` : '<p class="empty-ledger">Add a habit to begin your consistency ledger.</p>'}
    </section>
  `;
}

function renderWeekView(){
  const stats = weekStats();
  const streak = cleanStreak();
  const todayKey = fmt(new Date());
  let daysHtml = '';
  for(let i=0;i<7;i++){
    const d = new Date(currentMonday);
    d.setDate(d.getDate()+i);
    const k = fmt(d);
    const day = weekData[k] || {tasks:[], mood:0};
    const counts = dayTaskCounts(k);
    const isToday = k === todayKey;

    const dayHabits = habitsForDate(k);
    const habitRows = dayHabits.map((h, hpos) => habitTaskRowHtml(k, h, true, hpos===0, hpos===dayHabits.length-1)).join('');
    const dayTasks = day.tasks;
    const taskRows = dayTasks.map((t, idx) => `
      <div class="task ${t.done ? 'done':''}" data-row-type="task" data-row-date="${k}" data-row-id="${t.id}">
        <span class="drag-handle" onpointerdown="dragHandlePointerDown(event, 'task', '${k}')" title="Drag to reorder">⠿</span>
        <input type="checkbox" ${t.done?'checked':''} onchange="toggleTask('${k}', ${idx})">
        <div class="task-main">
          <span class="task-text">${escapeHtml(t.text)}</span>
          ${t.time ? `<span class="time-badge">${fmtTime(t.time)}</span>` : ''}
        </div>
        <span class="del" onclick="deleteTask('${k}', ${idx})">✕</span>
      </div>
    `).join('');

    let moodHtml = '';
    for(let m=1;m<=5;m++){
      moodHtml += `<div class="mood-dot ${day.mood>=m?'active':''}" onclick="setMood('${k}', ${m})"></div>`;
    }

    daysHtml += `
      <div class="day ${isToday?'today':''}">
        <div class="day-head" onclick="openDay('${k}')" title="Open day view">
          <div class="day-name">${DAY_NAMES[d.getDay()].slice(0,3)}</div>
          <div class="day-date">${d.getDate()}</div>
        </div>
        <div class="day-progress">${counts.total ? `${counts.done}/${counts.total} done` : 'nothing planned yet'}</div>
        <div class="mood-row">${moodHtml}</div>
        <div class="tasks">${habitRows}${taskRows}</div>
        <div class="add-task">
          <input type="text" placeholder="add a task" id="input-${k}" onkeydown="if(event.key==='Enter'){addTask('${k}', this.value); this.value='';}">
          <button onclick="const el=document.getElementById('input-${k}'); addTask('${k}', el.value); el.value='';">+</button>
        </div>
      </div>
    `;
  }

  return `
    <div class="week-toolbar">
      <div><span class="eyebrow">WEEKLY RHYTHM</span><div class="week-label">${weekLabel(currentMonday)}</div></div>
      <div class="week-nav">
        <button onclick="shiftWeek(-1)" aria-label="Previous week">←</button>
        <button onclick="shiftWeek(1)" aria-label="Next week">→</button>
      </div>
    </div>
    <div class="overview">
      <div>
        <div class="big">${stats.pct}%</div>
        <div class="big-label">of this week's tasks + habits done</div>
      </div>
      <div class="bar-track"><div class="bar-fill" style="width:${stats.pct}%"></div></div>
      <div class="streak"><div class="clean-streak-number">${streak}</div><div class="clean-streak-copy"><b>${streak} days clean</b><span>Across your quit habits</span></div></div>
    </div>
    <div class="section-heading weekly-section-title">
      <div><span class="eyebrow">DAILY REFLECTIONS</span><h2>One day at a time</h2></div>
      <span class="section-caption">A week of small, steady steps</span>
    </div>
    <div class="days">${daysHtml}</div>
    ${renderAdherenceMatrix()}
  `;
}

function renderDayView(){
  const k = selectedDayKey;
  const day = weekData[k] || {tasks:[], mood:0};
  const counts = dayTaskCounts(k);
  const pct = counts.total ? Math.round((counts.done/counts.total)*100) : 0;
  const d = parseDateKey(k);
  const label = d.toLocaleDateString('en-US', {weekday:'long', month:'long', day:'numeric'});

  let ringColor = pct === 100 && counts.total>0 ? 'var(--sage)' : 'var(--clay)';
  const ringBg = `conic-gradient(${ringColor} ${pct*3.6}deg, var(--highlight) 0deg)`;

  const dayHabits = habitsForDate(k);
  const habitRows = dayHabits.map((h, hpos) => habitTaskRowHtml(k, h, false, hpos===0, hpos===dayHabits.length-1)).join('');
  const dayTasks = day.tasks;
  const taskRows = dayTasks.map((t, idx) => `
    <div class="task detailed ${t.done ? 'done':''}" data-row-type="task" data-row-date="${k}" data-row-id="${t.id}">
      <span class="drag-handle" onpointerdown="dragHandlePointerDown(event, 'task', '${k}')" title="Drag to reorder">⠿</span>
      <input type="checkbox" ${t.done?'checked':''} onchange="toggleTask('${k}', ${idx})">
      <div class="task-main">
        <span class="task-text">${escapeHtml(t.text)}</span>
        <div class="task-controls">
          <input type="time" value="${t.time || ''}" title="Time (optional)" onchange="setTaskField('${k}', ${idx}, 'time', this.value)">
          ${pushSupported ? `<button class="remind-toggle ${t.remind?'on':''}" ${t.time?'':'disabled'} onclick="toggleTaskRemind('${k}', ${idx})" title="${t.time ? (t.remind ? 'Reminder on — tap to turn off' : 'Tap to get a push reminder at this time') : 'Set a time first'}">🔔</button>` : ''}
          ${orderArrowsHtml(`moveTask('${k}', ${idx}, -1)`, `moveTask('${k}', ${idx}, 1)`, idx===0, idx===dayTasks.length-1)}
        </div>
      </div>
      <span class="del" onclick="deleteTask('${k}', ${idx})">✕</span>
    </div>
  `).join('');
  const tasksHtml = (habitRows + taskRows) || `<div style="color:var(--ink-soft); font-size:13px;">Nothing planned yet — add what you want to get done today.</div>`;

  let moodHtml = '';
  for(let m=1;m<=5;m++){
    moodHtml += `<div class="mood-dot ${day.mood>=m?'active':''}" onclick="setMood('${k}', ${m})"></div>`;
  }

  return `
    <div class="day-view-card">
      <div class="day-view-head">
        <div><span class="eyebrow">DAILY MOMENTUM</span><div class="day-view-title">${label}</div><div class="section-caption">A disciplined mind, a tranquil day.</div></div>
        <div class="day-picker"><input type="date" value="${k}" onchange="changeSelectedDay(this.value)"></div>
      </div>
      <div class="ring-row">
        <div class="ring" style="background:${ringBg}">${pct}%</div>
        <div class="ring-meta">
          <b>${counts.done} of ${counts.total}</b> planned<br>
          ${counts.total===0 ? 'Add a few things below to get started.' : (pct===100 ? 'Everything on the list is done.' : `${counts.total-counts.done} left to go.`)}
        </div>
      </div>
      <div class="section-label">Today's tasks &amp; habits</div>
      <div class="day-view-tasks">${tasksHtml}</div>
      <div class="add-task day-add">
        <input type="text" placeholder="add a task" id="dayinput-${k}" onkeydown="if(event.key==='Enter'){addFromDayView('${k}');}">
        <input type="time" id="daytime-${k}" title="Time (optional)">
        <button onclick="addFromDayView('${k}')">+</button>
      </div>
      <div class="day-view-mood">
        <div class="section-label">How the day felt</div>
        <div class="mood-row">${moodHtml}</div>
      </div>
    </div>
  `;
}

function renderHabitsView(){
  const y = currentMonthDate.getFullYear();
  const m = currentMonthDate.getMonth();
  const numDays = daysInMonth(y, m);
  const todayKey = fmt(new Date());
  const monthLabel = currentMonthDate.toLocaleDateString('en-US', {month:'long', year:'numeric'});

  let headCells = '';
  for(let dnum=1; dnum<=numDays; dnum++){
    const dk = fmt(new Date(y, m, dnum));
    headCells += `<th class="${dk===todayKey?'today-col-head':''}">${dnum}</th>`;
  }

  let rows = '';
  if(habitsData.habits.length === 0){
    rows = `<tr><td colspan="${numDays+2}" class="habits-empty">No habits yet — add one above. It'll start showing up automatically in your daily checklist too.</td></tr>`;
  } else {
    habitsData.habits.forEach(h=>{
      let cells = '';
      for(let dnum=1; dnum<=numDays; dnum++){
        const dk = fmt(new Date(y, m, dnum));
        const beforeCreation = h.createdAt && dk < h.createdAt;
        const checked = !!(habitsData.checks[dk] && habitsData.checks[dk][h.id]);
        cells += beforeCreation
          ? `<td></td>`
          : `<td><div class="habit-dot ${checked?'done':''} ${h.type==='quit'?'quit':''} ${dk===todayKey?'today-col':''}" onclick="toggleHabit('${dk}', '${h.id}')"></div></td>`;
      }
      const streak = habitStreak(h.id);
      rows += `
        <tr>
          <td class="name-col">${escapeHtml(h.name)}<span class="habit-type-tag">${h.type==='quit'?'(quitting)':'(building)'}</span>${pushSupported ? `<input type="time" class="habit-remind" value="${h.reminderTime || ''}" title="Daily reminder time (optional) — fires if not checked off yet" onchange="setHabitReminder('${h.id}', this.value)">` : ''}<span class="del-habit" onclick="deleteHabit('${h.id}')">remove</span></td>
          ${cells}
          <td><span class="habit-streak">${streak>0 ? streak+' day'+(streak===1?'':'s') : '—'}</span></td>
        </tr>
      `;
    });
  }

  const weekDates = Array.from({length:7},(_,i)=>{
    const d = new Date(currentMonday);
    d.setDate(d.getDate()+i);
    return fmt(d);
  }).filter(key=>key<=todayKey);
  const periodPossible = weekDates.reduce((n,key)=>n+habitsForDate(key).length,0);
  const periodChecks = weekDates.reduce((n,key)=>n+habitsForDate(key).filter(h=>habitsData.checks[key] && habitsData.checks[key][h.id]).length,0);
  const fidelity = periodPossible ? Math.round(periodChecks/periodPossible*100) : 0;
  return `
    <div class="week-toolbar">
      <div><span class="eyebrow">HABITS MATRIX</span><div class="week-label">${monthLabel}</div></div>
      <div class="week-nav">
        <button onclick="shiftMonth(-1)" aria-label="Previous month">←</button>
        <button onclick="shiftMonth(1)" aria-label="Next month">→</button>
      </div>
    </div>
    <div class="fidelity-card">
      <div><span class="eyebrow">WEEKLY FIDELITY</span><div class="fidelity-number">${fidelity}%</div></div>
      <div class="fidelity-copy"><b>${periodChecks} / ${periodPossible}</b><span>habit check-ins this week</span></div>
      <div class="fidelity-note">Every check-in is progress.</div>
    </div>
    <div class="habits-card">
      <div class="section-heading"><div><span class="eyebrow">BUILD A STEADY RHYTHM</span><h2>Active ledger</h2></div><span class="section-caption">Daily record across the month</span></div>
      <div class="habits-add">
        <input type="text" placeholder="new habit, e.g. read 10 pages" id="new-habit-input" onkeydown="if(event.key==='Enter'){const t=document.getElementById('new-habit-type'); addHabit(this.value, t.value); this.value='';}">
        <select id="new-habit-type">
          <option value="build">Build (do it)</option>
          <option value="quit">Quit (avoid it)</option>
        </select>
        <button onclick="const el=document.getElementById('new-habit-input'); const t=document.getElementById('new-habit-type'); addHabit(el.value, t.value); el.value='';">Add habit</button>
      </div>
      <table class="habit-grid">
        <thead><tr><th class="name-col">Habit</th>${headCells}<th class="habit-streak">Current streak</th></tr></thead>
        <tbody>${rows}</tbody>
      </table>
    </div>
  `;
}

function errorBannerHtml(){
  const notes = [];
  if(lastError) notes.push(`<b>${escapeHtml(lastError)}</b>`);
  if(!STORAGE_OK) notes.push('This browser context blocks local storage, so you will be signed out on every refresh. Open the file directly or host it on your own site.');
  if(!notes.length) return '';
  return `<div class="error-banner"><div>${notes.join('<br>')}</div>${lastError ? '<span class="dismiss" onclick="dismissError()">dismiss</span>' : ''}</div>`;
}

// Single entry point: whenever nobody is signed in, always show the auth screen.
function render(){
  const appEl = document.getElementById('app');
  if(appEl) appEl.classList.toggle('wide', !recoveryMode && !!currentUser && currentView === 'week');
  if(recoveryMode){ renderRecovery(); return; }
  if(!currentUser){ renderAuth(); return; }
  renderApp();
}

function renderApp(){
  const app = document.getElementById('app');
  let body = '';
  if(currentView==='week') body = renderWeekView();
  else if(currentView==='day') body = renderDayView();
  else if(currentView==='habits') body = renderHabitsView();

  app.innerHTML = `
    <header>
      <div class="brand-lockup">
        <img class="brand-mark" src="logo.svg" alt="">
        <div>
          <h1>Steady</h1>
          <div class="sub">Small rituals, quiet progress, every day.</div>
        </div>
      </div>
      ${userBarHtml()}
    </header>
    ${errorBannerHtml()}
    ${pushBarHtml()}
    ${renderTabs()}
    ${body}
    <div class="footer-note">${persistOk
      ? 'Your data is saved to your account and follows you across devices.'
      : "⚠ Your last change did not reach the database — see the message above. It is kept for this visit only."}</div>
    ${renderStickyWidget()}
  `;
}

// ---- auth ----
function renderAuth(){
  const app = document.getElementById('app');
  const isSignup = authMode === 'signup';
  const isForgot = authMode === 'forgot';
  const storageNote = STORAGE_OK ? '' : `<div class="auth-msg error">This browser context blocks local storage, so you will be signed out on every refresh. Open the file directly or host it on your own site.</div>`;
  const subText = isForgot
    ? "Enter your email and we'll send you a link to choose a new password."
    : (isSignup ? 'Create your account — your tasks and habits will be yours alone.' : 'Sign in to pick up where you left off.');
  const emailEnter = isForgot ? 'submitAuth();' : "document.getElementById('auth-password').focus();";
  const passwordField = isForgot ? '' : `
      <div class="auth-field">
        <label>Password</label>
        <input type="password" id="auth-password" placeholder="${isSignup ? 'At least 6 characters' : ''}" onkeydown="if(event.key==='Enter'){submitAuth();}">
      </div>`;
  const forgotLink = (!isSignup && !isForgot) ? `<div class="auth-forgot"><a onclick="switchAuthMode('forgot')">Forgot password?</a></div>` : '';
  const btnLabel = isForgot ? 'Send reset link' : (isSignup ? 'Sign up' : 'Sign in');
  const toggle = isForgot
    ? `<a onclick="switchAuthMode('signin')">Back to sign in</a>`
    : (isSignup
        ? `Already have an account? <a onclick="switchAuthMode('signin')">Sign in</a>`
        : `New here? <a onclick="switchAuthMode('signup')">Create an account</a>`);
  app.innerHTML = `
    <div class="auth-wrap">
      <h1>Steady</h1>
      <div class="auth-sub">${subText}</div>
      ${authMessage ? `<div class="auth-msg ${authMessage.type}">${escapeHtml(authMessage.text)}</div>` : ''}
      ${storageNote}
      <div class="auth-field">
        <label>Email</label>
        <input type="email" id="auth-email" placeholder="you@example.com" value="${escapeHtml(authEmail)}" onkeydown="if(event.key==='Enter'){${emailEnter}}">
      </div>
      ${passwordField}
      ${forgotLink}
      <button class="auth-submit" onclick="submitAuth()">${btnLabel}</button>
      <div class="auth-toggle">${toggle}</div>
    </div>
  `;
}

// Shown after the user clicks the link in the reset email.
function renderRecovery(){
  const app = document.getElementById('app');
  app.innerHTML = `
    <div class="auth-wrap">
      <h1>Steady</h1>
      <div class="auth-sub">Choose a new password for your account.</div>
      ${authMessage ? `<div class="auth-msg ${authMessage.type}">${escapeHtml(authMessage.text)}</div>` : ''}
      <div class="auth-field">
        <label>New password</label>
        <input type="password" id="new-password" placeholder="At least 6 characters" onkeydown="if(event.key==='Enter'){document.getElementById('new-password2').focus();}">
      </div>
      <div class="auth-field">
        <label>Confirm new password</label>
        <input type="password" id="new-password2" onkeydown="if(event.key==='Enter'){submitNewPassword();}">
      </div>
      <button class="auth-submit" onclick="submitNewPassword()">Save new password</button>
    </div>
  `;
}

async function submitNewPassword(){
  const pw = document.getElementById('new-password').value;
  const pw2 = document.getElementById('new-password2').value;
  if(pw.length < 6){
    authMessage = {type:'error', text:'Your password needs at least 6 characters.'};
    render(); return;
  }
  if(pw !== pw2){
    authMessage = {type:'error', text:'The two passwords do not match.'};
    render(); return;
  }
  const btn = document.querySelector('.auth-submit');
  if(btn){ btn.disabled = true; btn.textContent = 'Saving…'; }
  try{
    const { data, error } = await sb.auth.updateUser({ password: pw });
    if(error) throw error;
    recoveryMode = false;
    currentUser = data.user;
    history.replaceState(null, '', window.location.pathname);
    await startApp();
  }catch(e){
    console.error('[Steady] Setting new password failed:', e);
    authMessage = {type:'error', text: describeErr(e)};
    render();
  }
}

function switchAuthMode(mode){
  const el = document.getElementById('auth-email');
  if(el) authEmail = el.value;
  authMode = mode;
  authMessage = null;
  render();
}

async function submitAuth(){
  const email = document.getElementById('auth-email').value.trim();
  const pwEl = document.getElementById('auth-password');
  const password = pwEl ? pwEl.value : '';
  authEmail = email;
  if(authMode === 'forgot'){
    if(!email){
      authMessage = {type:'error', text:'Enter your email address.'};
      render(); return;
    }
  } else if(!email || !password){
    authMessage = {type:'error', text:'Enter both an email and a password.'};
    render(); return;
  }
  if(!sb){
    authMessage = {type:'error', text:'This app is not connected to a database yet — the SUPABASE_URL and SUPABASE_ANON_KEY near the top of the file still need to be filled in.'};
    render(); return;
  }
  const btn = document.querySelector('.auth-submit');
  if(btn){ btn.disabled = true; btn.textContent = 'Working…'; }
  try{
    if(authMode === 'forgot'){
      const redirectTo = window.location.origin + window.location.pathname;
      const { error } = await sb.auth.resetPasswordForEmail(email, { redirectTo });
      if(error) throw error;
      authMessage = {type:'success', text:'If an account exists for that email, a reset link is on its way. Check your spam folder too.'};
      authMode = 'signin';
      render();
    } else if(authMode === 'signup'){
      const { data, error } = await sb.auth.signUp({ email, password });
      if(error) throw error;
      if(data.session){
        currentUser = data.user;
        await startApp();
      } else {
        authMessage = {type:'success', text:'Account created — check your email to confirm, then sign in.'};
        authMode = 'signin';
        render();
      }
    } else {
      const { data, error } = await sb.auth.signInWithPassword({ email, password });
      if(error) throw error;
      currentUser = data.user;
      await startApp();
    }
  }catch(e){
    const what = authMode === 'signup' ? 'Sign up' : (authMode === 'forgot' ? 'Password reset' : 'Sign in');
    console.error('[Steady] ' + what + ' failed:', e);
    authMessage = {type:'error', text: describeErr(e)};
    render();
  }
}

async function logout(){
  loggingOut = true;
  try{
    if(sb) await sb.auth.signOut();
  }catch(e){
    console.error('[Steady] Sign out failed:', e);
  }
  loggingOut = false;
  currentUser = null;
  weekData = {};
  habitsData = { habits: [], checks: {} };
  memoryCache = {};
  currentView = 'week';
  lastError = null;
  authMessage = null;
  stickyNote = '';
  pushSubscribed = false;
  render();
}

function renderStickyWidget(){
  if(!stickyOpen){
    return `<button class="sticky-toggle" onclick="toggleStickyNote()" title="Sticky note">🗒️</button>`;
  }
  return `
    <div class="sticky-panel">
      <div class="sticky-panel-head">
        <span>STICKY NOTE</span>
        <span class="sticky-close" onclick="toggleStickyNote()">✕</span>
      </div>
      <textarea id="sticky-textarea" placeholder="jot anything here — not a task, just a note to yourself" oninput="onStickyInput(this.value)">${escapeHtml(stickyNote)}</textarea>
      <div class="sticky-saved" id="sticky-saved-label"></div>
    </div>
  `;
}

function userBarHtml(){
  if(!currentUser) return '';
  return `<div class="user-bar">${escapeHtml(currentUser.email || '')} <span class="logout" onclick="logout()">Log out</span></div>`;
}

async function startApp(){
  authMessage = null;
  lastError = null;
  console.log('[Steady] signed in as', currentUser && currentUser.email);
  await loadHabitsGlobal();
  await loadWeek();
  await loadStickyNote();
  await checkPushStatus();
}

// ---- push notifications ----
function urlBase64ToUint8Array(base64String){
  const padding = '='.repeat((4 - (base64String.length % 4)) % 4);
  const base64 = (base64String + padding).replace(/-/g, '+').replace(/_/g, '/');
  const raw = atob(base64);
  const arr = new Uint8Array(raw.length);
  for(let i=0;i<raw.length;i++) arr[i] = raw.charCodeAt(i);
  return arr;
}
async function checkPushStatus(){
  if(!pushSupported) return;
  try{
    const reg = await navigator.serviceWorker.register('sw.js');
    const sub = await reg.pushManager.getSubscription();
    pushSubscribed = !!sub;
  }catch(e){
    console.error('[Steady] Service worker check failed:', e);
    pushSubscribed = false;
  }
  render();
}
async function enablePush(){
  if(!pushSupported || pushBusy) return;
  pushBusy = true;
  render();
  try{
    const permission = await Notification.requestPermission();
    if(permission !== 'granted'){
      lastError = 'Notifications were blocked. Allow them for this site in your browser settings and try again.';
      pushBusy = false;
      render();
      return;
    }
    const reg = await navigator.serviceWorker.register('sw.js');
    await navigator.serviceWorker.ready;
    let sub = await reg.pushManager.getSubscription();
    if(!sub){
      sub = await reg.pushManager.subscribe({
        userVisibleOnly: true,
        applicationServerKey: urlBase64ToUint8Array(VAPID_PUBLIC_KEY)
      });
    }
    const raw = sub.toJSON();
    const timezone = Intl.DateTimeFormat().resolvedOptions().timeZone || 'UTC';
    const { error } = await sb.from('push_subscriptions').upsert({
      user_id: currentUser.id,
      endpoint: raw.endpoint,
      p256dh: raw.keys.p256dh,
      auth: raw.keys.auth,
      timezone
    }, { onConflict: 'endpoint' });
    if(error) throw error;
    pushSubscribed = true;
    lastError = null;
  }catch(e){
    console.error('[Steady] Enabling reminders failed:', e);
    reportError('Enabling reminders', e);
  }
  pushBusy = false;
  render();
}
async function disablePush(){
  if(!pushSupported || pushBusy) return;
  pushBusy = true;
  render();
  try{
    const reg = await navigator.serviceWorker.getRegistration();
    const sub = reg && await reg.pushManager.getSubscription();
    if(sub){
      await sb.from('push_subscriptions').delete().eq('endpoint', sub.endpoint);
      await sub.unsubscribe();
    }
    pushSubscribed = false;
  }catch(e){
    console.error('[Steady] Disabling reminders failed:', e);
    reportError('Disabling reminders', e);
  }
  pushBusy = false;
  render();
}
function pushBarHtml(){
  if(!pushSupported){
    return `<div class="push-bar"><span class="push-dot"></span>Reminders aren't available in this browser, or the app isn't set up for them yet.</div>`;
  }
  if(pushSubscribed){
    return `<div class="push-bar"><span class="push-dot on"></span>Reminders are on for this device.
      <button onclick="disablePush()" ${pushBusy?'disabled':''}>${pushBusy ? 'Working…' : 'Turn off'}</button></div>`;
  }
  return `<div class="push-bar"><span class="push-dot"></span>Get a push notification when a task or habit's reminder time comes up — set times with the 🔔 in the Day tab or next to a habit.
    <button onclick="enablePush()" ${pushBusy?'disabled':''}>${pushBusy ? 'Working…' : 'Turn on reminders'}</button></div>`;
}

async function loadStickyNote(){
  const loaded = await storageGet('sticky-note');
  stickyNote = (loaded && typeof loaded.text === 'string') ? loaded.text : '';
  render();
}
function toggleStickyNote(){
  stickyOpen = !stickyOpen;
  render();
  if(stickyOpen){
    const el = document.getElementById('sticky-textarea');
    if(el) el.focus();
  }
}
function onStickyInput(value){
  stickyNote = value;
  stickySavedState = 'saving';
  updateSavedLabel();
  if(stickySaveTimer) clearTimeout(stickySaveTimer);
  stickySaveTimer = setTimeout(async () => {
    await storageSet('sticky-note', { text: stickyNote });
    stickySavedState = 'saved';
    updateSavedLabel();
    stickySaveTimer = setTimeout(() => { stickySavedState = 'idle'; updateSavedLabel(); }, 1500);
  }, 500);
}
function updateSavedLabel(){
  const el = document.getElementById('sticky-saved-label');
  if(!el) return;
  el.textContent = stickySavedState === 'saving' ? 'saving…' : (stickySavedState === 'saved' ? 'saved' : '');
}

async function init(){
  if(!sb){
    authMessage = {type:'error', text:'This app is not connected to a database yet — fill in SUPABASE_URL and SUPABASE_ANON_KEY near the top of the file.'};
    render();
    return;
  }

  // Listen first so we can see exactly why a session ends.
  sb.auth.onAuthStateChange((event, session) => {
    console.log('[Steady] auth event:', event, session ? 'session present' : 'no session');
    if(event === 'PASSWORD_RECOVERY'){
      recoveryMode = true;
      render();
      return;
    }
    if(event === 'SIGNED_OUT' && currentUser){
      currentUser = null;
      weekData = {};
      habitsData = { habits: [], checks: {} };
      if(!loggingOut){
        authMessage = {type:'error', text:'Your session ended (it may have expired, or the project was paused). Please sign in again.'};
      }
      render();
    }
  });

  // Opened from a "reset password" email: show the new-password form first.
  if(recoveryMode){ render(); return; }

  // Expired / already-used reset link
  if(LINK_ERROR_CODE || LINK_ERROR_DESC){
    authMessage = {type:'error', text: LINK_ERROR_CODE === 'otp_expired'
      ? 'That reset link has expired or was already used. Request a new one below.'
      : (LINK_ERROR_DESC || 'That link is not valid.')};
    authMode = 'forgot';
    history.replaceState(null, '', window.location.pathname);
  }

  try{
    const { data, error } = await sb.auth.getSession();
    if(error) throw error;
    console.log('[Steady] restored session:', data.session ? 'yes' : 'none');
    if(data.session){
      currentUser = data.session.user;
      await startApp();
    } else {
      render();
    }
  }catch(e){
    console.error('[Steady] Restoring session failed:', e);
    authMessage = {type:'error', text:'Could not restore your session: ' + describeErr(e)};
    render();
  }
}
init();
</script>
